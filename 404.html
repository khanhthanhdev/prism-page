<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to PRISM Benchmark…</title>
    <link rel="canonical" href="https://prism-benchmark.github.io/" />
    <meta http-equiv="refresh" content="0; url=https://prism-benchmark.github.io/" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var oldBase = "/prism-page";
        var newBase = "https://prism-benchmark.github.io";
        var path = location.pathname.indexOf(oldBase) === 0
          ? location.pathname.slice(oldBase.length) || "/"
          : "/";
        location.replace(newBase + path + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>
      PRISM Benchmark has moved to
      <a href="https://prism-benchmark.github.io/">https://prism-benchmark.github.io/</a>.
    </p>
  </body>
</html>
